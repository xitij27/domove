# Builds the sideloadable arm64 release APK, uploads it as a run artifact and,
# on every push to main, publishes it as the next GitHub release (v0.1.2 -> v0.1.3).
name: Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write # to create the release

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      # EXPO_PUBLIC_ values are inlined into the JS bundle; without them the app builds but shows no map/data.
      EXPO_PUBLIC_MAPBOX_TOKEN: ${{ secrets.EXPO_PUBLIC_MAPBOX_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - run: npm ci

      - run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a

      - uses: actions/upload-artifact@v7
        with:
          name: construction-site-radar-arm64-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish the next release
        if: github.event_name == 'push'
        working-directory: mobile/android/app/build/outputs/apk/release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(git ls-remote --tags --refs origin 'v*' | sed 's|.*refs/tags/||' | sort -V | tail -1)
          IFS=. read -r major minor patch <<< "${last:-v0.0.0}"
          tag="${major}.${minor}.$((patch + 1))"
          apk="construction-site-radar-${tag}-arm64.apk"
          cp app-release.apk "$apk"
          gh release create "$tag" "$apk" --target "$GITHUB_SHA" --title "Construction Site Radar $tag" \
            --notes "64-bit Android only. Signed with the standard debug key, for sideloading only." --generate-notes
