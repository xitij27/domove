# Runs the app's and the planner dashboard's unit tests, and the route database tests, on every pull request.
# Each job runs only when its own folder changed (or this workflow did), so a README-only change runs none.
name: Checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mobile: ${{ steps.diff.outputs.mobile }}
      dashboard: ${{ steps.diff.outputs.dashboard }}
      database: ${{ steps.diff.outputs.database }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Skipped jobs count as passed for required checks, so a filter here cannot block a pull request.
      - name: Find which parts changed
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) range="origin/$BASE_REF...HEAD" ;;
            push) range="$BEFORE..HEAD" ;;
            *) range="" ;;
          esac
          if [ -n "$range" ] && files=$(git diff --name-only "$range" 2>/dev/null); then
            echo "$files"
          else
            files=".github/workflows/checks.yml" # manual run, new branch or unknown base: run everything
          fi
          for part in mobile:mobile dashboard:dashboard database:backend/supabase; do
            name=${part%%:*}; dir=${part#*:}
            if echo "$files" | grep -qE "^($dir/|\.github/workflows/checks\.yml$)"; then
              echo "$name=true" >> "$GITHUB_OUTPUT"
            else
              echo "$name=false" >> "$GITHUB_OUTPUT"
            fi
          done

  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci
      - run: npm test -- --ci
      - run: npx tsc --noEmit
      - run: npm run lint

  dashboard:
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - run: npm ci
      - run: npm test -- --run
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build

  database:
    needs: changes
    if: needs.changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT: ${{ github.workspace }}/../routes-db
    steps:
      - uses: actions/checkout@v7

      # Supabase keys migrations by the number before the first underscore, so two
      # branches that pick the same one pass alone and break main once both merge.
      - name: Check that no two migrations share a version
        working-directory: backend/supabase/migrations
        run: |
          dupes=$(ls *.sql | cut -d_ -f1 | sort | uniq -d)
          for v in $dupes; do
            echo "::error::Migrations share version $v: $(echo ${v}_*.sql). Rename the newer one."
          done
          [ -z "$dupes" ]

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # All migrations, minus the construction-sites migration's first sync of the
      # city's live feeds, which would make this job depend on them.
      - name: Create a local Supabase project with the migrations
        run: |
          mkdir -p "$PROJECT" && cd "$PROJECT"
          supabase init < /dev/null
          mkdir -p supabase/migrations supabase/tests
          cp "$GITHUB_WORKSPACE"/backend/supabase/migrations/*.sql supabase/migrations/
          sed -i '/^select private.sync_construction_sites();$/d' supabase/migrations/*_construction_sites.sql
          cp -r "$GITHUB_WORKSPACE"/backend/supabase/tests/database supabase/tests/
          ls supabase/migrations supabase/tests/database

      # Starts the database (applying the migrations) and the REST API in one go:
      # after `supabase db start`, `supabase start` would not start the other services.
      # Auth stays on because `supabase status` only reports the API keys with it.
      - name: Start Supabase with the migrations
        working-directory: ${{ env.PROJECT }}
        run: supabase start -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor,postgres-meta

      - name: Run the pgTAP tests
        working-directory: ${{ env.PROJECT }}
        run: supabase test db

      - name: Run the REST smoke test
        working-directory: ${{ env.PROJECT }}
        run: |
          supabase status -o env | cut -d= -f1
          eval "$(supabase status -o env)"
          SUPABASE_URL="$API_URL" SUPABASE_PUBLISHABLE_KEY="${PUBLISHABLE_KEY:-$ANON_KEY}" \
            node "$GITHUB_WORKSPACE/backend/supabase/tests/routes-rest.mjs"
